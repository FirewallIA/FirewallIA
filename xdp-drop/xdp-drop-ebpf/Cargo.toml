[package]
name = "xdp-drop-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
# Utiliser la version publiée d'aya-ebpf (pas besoin du fork)
aya-ebpf = "0.12"
aya-log-ebpf = "0.12"
xdp-drop-common = { path = "../xdp-drop-common" }
network-types = "0.0.7"

[lib]
path = "src/main.rs"
crate-type = ["staticlib"]

[build-dependencies]
which = { version = "7.0.0", default-features = false }
